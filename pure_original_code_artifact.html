                                        >
                                            ✨ AI 智慧貼上匯入
                                            <span className="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded-full font-bold">PRO</span>
                                        </button>
                                    </div>

                                    {formError && (
                                        <div className="bg-red-50 border-l-4 border-red-500 text-red-800 p-3 rounded-r-lg text-sm font-medium">
                                            ⚠️ {formError}
                                        </div>
                                    )}

                                    {importMode === "ai" ? (
                                        <div className="space-y-4">
                                            <div className="bg-stone-50 p-4 rounded-2xl border border-stone-200/60 space-y-3">
                                                <div>
                                                    <label className="text-xs font-bold text-stone-700 block mb-1.5 flex items-center justify-between">
                                                        <span>🔑 Gemini API 金鑰 (API Key)</span>
                                                        <a 
                                                            href="https://aistudio.google.com/" 
                                                            target="_blank" 
                                                            rel="noopener noreferrer" 
                                                            className="text-amber-600 hover:text-amber-700 font-semibold underline text-[11px]"
                                                        >
                                                            免費申請金鑰 (Google AI Studio) ↗
                                                        </a>
                                                    </label>
                                                    <input 
                                                        type="password" 
                                                        placeholder="貼上您的 AI Studio API Key (AIzaSy...)" 
                                                        value={apiKey}
                                                        onChange={e => setApiKey(e.target.value)}
                                                        className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    />
                                                </div>

                                                <div>
                                                    <label className="text-xs font-bold text-stone-700 block mb-1">
                                                        🤖 選擇 AI 模型 (Model)
                                                    </label>
                                                    <select 
                                                        value={apiModel}
                                                        onChange={e => {
                                                            setApiModel(e.target.value);
                                                            try { localStorage.setItem("magic_baking_gemini_model", e.target.value); } catch(err){}
                                                        }}
                                                        className="w-full bg-white border border-stone-200 rounded-xl p-2 text-xs text-stone-700 font-medium focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    >
                                                        <option value="gemini-2.0-flash">gemini-2.0-flash (推薦 / 免費且速度最快)</option>
                                                        <option value="gemini-1.5-flash">gemini-1.5-flash (穩定舊版備用)</option>
                                                        <option value="gemini-2.5-flash">gemini-2.5-flash (最新預覽版)</option>
                                                    </select>
                                                </div>

                                                <p className="text-[10px] text-stone-400 leading-relaxed">
                                                    🔒 您的金鑰只會安全儲存在本機 LocalStorage 中，直接發送至 Google 官方 API。<br/>
                                                    💡 若遇到額度用盡 (Quota Exceeded)，可在 Google AI Studio 中「建立新 Project」獲取新 Key，或切換模型。
                                                </p>
                                            </div>

                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-stone-700 block">
                                                    📋 貼上原始食譜文字 (支援中/英/日等任何語言，包含任何單位)
                                                </label>
                                                <textarea 
                                                    placeholder={`範例：
Lemon Sugar Cake
Ingredients:
- 1 cup white sugar
- 1/2 cup unsalted butter, softened
- 2 large eggs
- 1.5 cups all-purpose flour
- 1/2 cup whole milk
- 350F for 30 minutes in a 9-inch round pan.

Instructions:
1. Preheat...`} 
                                                    value={rawRecipeText}
                                                    onChange={e => setRawRecipeText(e.target.value)}
                                                    rows="10"
                                                    className="w-full bg-stone-50 border border-stone-200 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                ></textarea>
                                            </div>

                                            <div className="pt-2">
                                                <button
                                                    type="button"
                                                    disabled={isImporting}
                                                    onClick={handleAIImport}
                                                    className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-xl transition shadow-sm flex items-center justify-center gap-2 disabled:bg-amber-300 disabled:cursor-not-allowed"
                                                >
                                                    {isImporting ? (
                                                        <>
                                                            <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                            </svg>
                                                            正在智慧解析中，請稍候...
                                                        </>
                                                    ) : (
                                                        <>🚀 開始 AI 智慧轉換</>
                                                    )}
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <>
                                            {/* Basic Info */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-xs font-bold text-stone-600 block mb-1">中文食譜名稱 <span className="text-red-500">*</span></label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="例：經典老奶奶檸檬蛋糕" 
                                                        value={formName}
                                                        onChange={e => setFormName(e.target.value)}
                                                        className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-stone-600 block mb-1">英文食譜名稱</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="例：Classic Lemon Cake" 
                                                        value={formEngName}
                                                        onChange={e => setFormEngName(e.target.value)}
                                                        className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="text-xs font-bold text-stone-600 block mb-1">食譜簡介</label>
                                                    <textarea 
                                                        placeholder="簡短描述這款蛋糕的特色與風味..." 
                                                        value={formDesc}
                                                        onChange={e => setFormDesc(e.target.value)}
                                                        rows="2"
                                                        className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    ></textarea>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-stone-600 block mb-1">配方原設計烤模形狀 <span className="text-red-500">*</span></label>
                                                    <select 
                                                        value={formPanShape}
                                                        onChange={e => setFormPanShape(e.target.value)}
                                                        className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                    >
                                                        <option value="round">⭕ 圓形烤模</option>
                                                        <option value="square">⬜ 方形烤模</option>
                                                        <option value="loaf">🍞 長條烤模</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    {formPanShape === "round" && (
                                                        <>
                                                            <label className="text-xs font-bold text-stone-600 block mb-1">圓模直徑 (英吋) <span className="text-red-500">*</span></label>
                                                            <select 
                                                                value={formBaseSize}
                                                                onChange={e => setFormBaseSize(Number(e.target.value))}
                                                                className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                            >
                                                                {[5, 6, 7, 8, 9, 10, 12].map(n => (
                                                                    <option key={n} value={n}>{n} 吋</option>
                                                                ))}
                                                            </select>
                                                        </>
                                                    )}
                                                    {formPanShape === "square" && (
                                                        <>
                                                            <label className="text-xs font-bold text-stone-600 block mb-1">方模邊長 (英吋) <span className="text-red-500">*</span></label>
                                                            <input 
                                                                type="number" 
                                                                value={formBaseSize}
                                                                onChange={e => setFormBaseSize(Number(e.target.value))}
                                                                className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                            />
                                                        </>
                                                    )}
                                                    {formPanShape === "loaf" && (
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div>
                                                                <label className="text-xs font-bold text-stone-600 block mb-1">長 (英吋) <span className="text-red-500">*</span></label>
                                                                <input 
                                                                    type="number" 
                                                                    value={formPanLength}
                                                                    onChange={e => setFormPanLength(Number(e.target.value))}
                                                                    className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-xs font-bold text-stone-600 block mb-1">寬 (英吋) <span className="text-red-500">*</span></label>
                                                                <input 
                                                                    type="number" 
                                                                    value={formPanWidth}
                                                                    onChange={e => setFormPanWidth(Number(e.target.value))}
                                                                    className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2.5 text-sm text-center focus:outline-none focus:ring-2 focus:ring-amber-500"
                                                                />
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Dynamic Ingredients */}
                                            <div className="border-t border-stone-100 pt-6">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h4 className="text-sm font-bold text-stone-800">📋 材料明細設定</h4>
                                                    <button 
                                                        type="button"
                                                        onClick={handleAddIngredientRow}
                                                        className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                                    >
                                                        ➕ 新增材料行
                                                    </button>
                                                </div>
                                                <div className="space-y-2">
                                                    {formIngredients.map((ing, idx) => (
                                                        <div key={idx} className="grid grid-cols-12 gap-1.5 items-center bg-stone-50 p-2 rounded-xl border border-stone-100">
                                                            <select 
                                                                value={ing.category}
                                                                onChange={e => handleIngredientChange(idx, 'category', e.target.value)}
                                                                className="col-span-3 bg-white border border-stone-200 rounded-lg p-1.5 text-xs"
                                                            >
                                                                <option value="dry">🌾 乾料</option>
                                                                <option value="wet">🥛 濕料</option>
                                                                <option value="flavor">🍋 調味</option>
                                                                <option value="glaze">🍯 淋醬</option>
                                                                <option value="decor">🍓 裝飾/其他</option>
                                                            </select>
                                                            <input 
                                                                type="text" 
                                                                placeholder="材料名稱" 
                                                                value={ing.name}
                                                                onChange={e => handleIngredientChange(idx, 'name', e.target.value)}
                                                                className="col-span-3 bg-white border border-stone-200 rounded-lg p-1.5 text-xs"
                                                            />
                                                            <input 
                                                                type="number" 
                                                                step="any"
                                                                placeholder="基準量" 
                                                                value={ing.baseValue}
                                                                onChange={e => handleIngredientChange(idx, 'baseValue', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-xs text-center"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                placeholder="單位 (克/毫升)" 
                                                                value={ing.unit}
                                                                onChange={e => handleIngredientChange(idx, 'unit', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-xs text-center"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                placeholder="備註" 
                                                                value={ing.note || ""}
                                                                onChange={e => handleIngredientChange(idx, 'note', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-[10px]"
                                                            />
                                                            <div className="col-span-12 md:col-span-1 flex justify-end">
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleRemoveIngredientRow(idx)}
                                                                    className="text-red-500 hover:text-red-700 font-bold text-sm p-1"
                                                                    title="移除此行"
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Dynamic Steps */}
                                            <div className="border-t border-stone-100 pt-6">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h4 className="text-sm font-bold text-stone-800">👩‍🍳 製作步驟</h4>
                                                    <button 
                                                        type="button"
                                                        onClick={handleAddStepRow}
                                                        className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                                    >
                                                        ➕ 新增步驟
                                                    </button>
                                                </div>
                                                <p className="text-[10px] text-stone-500 mb-3 bg-amber-50 p-2 rounded-lg border border-amber-100">
                                                    💡 <strong>魔法提示：</strong>在步驟文字中填入大括號材料 <code>&#123;材料名稱&#125;</code> (如：<code>將乾粉類 &#123;中筋麵粉&#125; 混勻</code>)，網頁會自動依照當前縮放倍率顯示克數！
                                                </p>
                                                <div className="space-y-2">
                                                    {formInstructions.map((step, idx) => (
                                                        <div key={idx} className="flex gap-2 items-start bg-stone-50 p-2 rounded-xl border border-stone-100">
                                                            <span className="text-xs font-black text-amber-600 bg-amber-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-1">
                                                                {step.step}
                                                            </span>
                                                            <textarea 
                                                                placeholder={`步驟 ${step.step} 敘述...`} 
                                                                value={step.text}
                                                                onChange={e => handleStepChange(idx, e.target.value)}
                                                                rows="2"
                                                                className="flex-1 bg-white border border-stone-200 rounded-lg p-2 text-xs focus:outline-none focus:ring-1 focus:ring-amber-500"
                                                            ></textarea>
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleRemoveStepRow(idx)}
                                                                className="text-red-500 hover:text-red-700 font-bold text-sm p-1 mt-1"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Cooking Tips */}
                                            <div className="border-t border-stone-100 pt-6">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h4 className="text-sm font-bold text-stone-800">✨ 烘焙小貼士 / 溫馨提示</h4>
                                                    <button 
                                                        type="button"
                                                        onClick={handleAddTipRow}
                                                        className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                                    >
                                                        ➕ 新增貼士
                                                    </button>
                                                </div>
                                                <div className="space-y-2">
                                                    {formTips.map((tip, idx) => (
                                                        <div key={idx} className="flex gap-2 items-center bg-stone-50 p-2 rounded-xl border border-stone-100">
                                                            <input 
                                                                type="text" 
                                                                placeholder="例如：奶油切丁軟化得比較快" 
                                                                value={tip}
                                                                onChange={e => handleTipChange(idx, e.target.value)}
                                                                className="flex-1 bg-white border border-stone-200 rounded-lg p-1.5 text-xs focus:outline-none"
                                                            />
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleRemoveTipRow(idx)}
                                                                className="text-red-500 hover:text-red-700 font-bold text-sm p-1"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="p-6 border-t border-stone-100 bg-stone-50 flex justify-end gap-3 rounded-b-3xl">
                                    <button 
                                        type="button"
                                        onClick={() => { setIsModalOpen(false); resetForm(); }}
                                        className="bg-stone-200 hover:bg-stone-300 text-stone-700 text-sm font-bold py-2 px-4 rounded-xl transition"
                                    >
                                        取消
                                    </button>
                                    {importMode === "manual" && (
                                        <button 
                                            type="button"
                                            onClick={handleSaveRecipe}
                                            className="bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold py-2 px-6 rounded-xl transition shadow-xs"
                                        >
                                            儲存食譜
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    
    
    </script>
</body>
</html>
