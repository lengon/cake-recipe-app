            // 從 LocalStorage 載入自訂食譜，並合併檔案內的 savedRecipes（檔案發布內容優先於舊快取）
            const [customRecipes, setCustomRecipes] = useState(() => {
                try {
                    const saved = localStorage.getItem("magic_baking_custom_recipes");
                    const parsedLocal = saved ? JSON.parse(saved) : {};
                    return { ...parsedLocal, ...savedRecipes };
                } catch (e) {
                    return { ...savedRecipes };
                }
            });

            const [deletedIds, setDeletedIds] = useState(() => {
                try {
                    const saved = localStorage.getItem("magic_baking_deleted_recipes");
                    const parsedLocal = saved ? JSON.parse(saved) : [];
                    const baseDeleted = (typeof savedDeletedIds !== 'undefined' && Array.isArray(savedDeletedIds)) ? savedDeletedIds : [];
                    return Array.from(new Set([...baseDeleted, ...parsedLocal]));
                } catch (e) {
                    return (typeof savedDeletedIds !== 'undefined' && Array.isArray(savedDeletedIds)) ? [...savedDeletedIds] : [];
                }
            });

            const rawAllRecipes = { ...recipes, ...customRecipes };
            const allRecipes = {};

            const [scaleMode, setScaleMode] = useState("factor"); // 'factor' or 'pan'
            const [scaleFactor, setScaleFactor] = useState(1.0);
            
            // Pan size calculations
            const [panType, setPanType] = useState("round");
            const [roundSize, setRoundSize] = useState(9); // Default target is 9-inch round
            const [squareLength, setSquareLength] = useState(8);
            const [squareWidth, setSquareWidth] = useState(8);

            // Timer state
            const [timerSeconds, setTimerSeconds] = useState(1800); // 30 mins default
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [timerDisplay, setTimerDisplay] = useState("30:00");

            // Interactive checklist
            const [checkedSteps, setCheckedSteps] = useState({});

            // 新增食譜 Modal 相關狀態

            const [editingRecipeId, setEditingRecipeId] = useState(null);
            const [formError, setFormError] = useState("");
            const [formName, setFormName] = useState("");
            const [formEngName, setFormEngName] = useState("");
            const [formDesc, setFormDesc] = useState("");
            const [formPanShape, setFormPanShape] = useState("round");
            const [formBaseSize, setFormBaseSize] = useState(9);
            const [formPanLength, setFormPanLength] = useState(9);
            const [formPanWidth, setFormPanWidth] = useState(5);
            const [formIngredients, setFormIngredients] = useState([emptyIngredient()]);
            const [formInstructions, setFormInstructions] = useState([emptyStep(1)]);
            const [formTips, setFormTips] = useState([""]);

            // AI 智慧匯入相關狀態
            const [importMode, setImportMode] = useState("manual"); // "manual" | "ai"
            const [apiProvider, setApiProvider] = useState(() => {
                try { return localStorage.getItem("magic_baking_api_provider") || "groq"; } catch(e) { return "groq"; }
            });
            const [rawRecipeText, setRawRecipeText] = useState("");
            const [apiKey, setApiKey] = useState(() => {
                try { return localStorage.getItem("magic_baking_gemini_api_key") || ""; } catch (e) { return ""; }
            });
            const [apiModel, setApiModel] = useState(() => {
                try { return localStorage.getItem("magic_baking_gemini_model") || "gemini-2.0-flash"; } catch (e) { return "gemini-2.0-flash"; }
            });
            const [groqKey, setGroqKey] = useState(() => {
                try { return localStorage.getItem("magic_baking_groq_api_key") || ""; } catch (e) { return ""; }

            const [openrouterKey, setOpenrouterKey] = useState(() => {

            const [manualJsonText, setManualJsonText] = useState("");
            const [copyPromptStatus, setCopyPromptStatus] = useState("");
            const [isImporting, setIsImporting] = useState(false);

            const activeRecipe = allRecipes[activeRecipeId] || Object.values(allRecipes)[0] || {};

            // 切換食譜時更新預設計時器時間
            useEffect(() => {
                let defaultMins = 30; // 預設 30 分鐘
                if (activeRecipeId === "almondCitrus" || activeRecipeId === "coconutCake" || activeRecipeId === "almondCardamom" || activeRecipeId === "almondLemonOliveOil") {
                    defaultMins = 25;
                } else if (activeRecipeId === "appleCustard" || activeRecipeId === "mandarinOliveOil" || activeRecipeId === "appleSpiceLoaf" || activeRecipeId === "orangeAlmondButter") {
                    defaultMins = 50;
                } else if (activeRecipeId === "honeyOrangeCornmealLoaf") {
                    defaultMins = 45;
                } else if (activeRecipeId === "chocolateCreamCheesePound") {
                    defaultMins = 90; // 萬丈高蛋糕需要超長烘烤時間
                }
                setTimerSeconds(defaultMins * 60);
                setIsTimerRunning(false);
            }, [activeRecipeId]);

            // Calculate Scale Factor based on mode
            useEffect(() => {
                if (scaleMode === "pan") {
                    const basePan = activeRecipe.basePan || { shape: "round", size: 9 };
                    let baseArea = 0;

                    // 算出基準烤模的面積 (平方英吋)
                    if (basePan.shape === "round") {
                        baseArea = Math.PI * Math.pow(basePan.size / 2, 2);
                    } else if (basePan.shape === "loaf") {
                        const len = basePan.length || 9;
                        const wid = basePan.width || 5;
                        baseArea = len * wid;
                    } else if (basePan.shape === "square") {
                        const size = basePan.size || 8;
                        baseArea = size * size;
                    }

                    // 算出目標烤模的面積 (平方英吋)
                    let targetArea = baseArea;
                    if (panType === "round") {
                        targetArea = Math.PI * Math.pow(roundSize / 2, 2);
                    } else if (panType === "square") {
                        targetArea = squareLength * squareWidth;
                    }

                    const calculatedFactor = targetArea / baseArea;
                    setScaleFactor(Math.round(calculatedFactor * 100) / 100);
                }
            }, [scaleMode, panType, roundSize, squareLength, squareWidth, activeRecipeId]);

            // Reset checklist when recipe changes
            useEffect(() => {
                setCheckedSteps({});
            }, [activeRecipeId]);

            // Timer Logic
            useEffect(() => {
                let interval = null;
                if (isTimerRunning && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => prev - 1);
                    }, 1000);
                } else if (timerSeconds === 0) {
                    setIsTimerRunning(false);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timerSeconds]);

            useEffect(() => {
                const mins = Math.floor(timerSeconds / 60);
                const secs = timerSeconds % 60;
                setTimerDisplay(`${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
            }, [timerSeconds]);

            // Scale calculations helper
            const getScaledValue = (ingredient) => {
                if (ingredient.isStatic) return ingredient.unit;
                const value = ingredient.baseValue * scaleFactor;
                if (value % 1 === 0) return value;
                return value.toFixed(1);
            };

            // Dynamic instruction text with scaled amounts (Safely HTML Escaped for XSS security)
            const renderInstructionText = (text) => {
                if (!text) return null;
                const escapeHtml = (str) => String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

                let formattedText = escapeHtml(text);
                activeRecipe.ingredients.forEach(ing => {
                    if (!ing.name) return;
                    const safeName = escapeHtml(ing.name);
                    const placeholder = `{${safeName}}`;
                    if (formattedText.includes(placeholder)) {
                        const scaledVal = getScaledValue(ing);
                        const safeUnit = escapeHtml(ing.unit || '');
                        formattedText = formattedText.replace(
                            new RegExp(placeholder.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), 
                            `<span class="text-amber-700 font-semibold border-b-2 border-amber-200">${safeName} ${scaledVal}${ing.isStatic ? '' : safeUnit}</span>`
                        );
                    }
                });
                return <span dangerouslySetInnerHTML={{ __html: formattedText }} />;
            };

            // 自訂食譜表單控制
            const handleAddIngredientRow = () => {
                setFormIngredients([...formIngredients, emptyIngredient()]);
            };

            const handleRemoveIngredientRow = (index) => {
                const updated = formIngredients.filter((_, i) => i !== index);
                setFormIngredients(updated.length ? updated : [emptyIngredient()]);
            };

            const handleIngredientChange = (index, field, value) => {
                const updated = formIngredients.map((ing, i) => {
                    if (i === index) return { ...ing, [field]: value };
                    return ing;
                });
                setFormIngredients(updated);
            };

            const handleAddStepRow = () => {
                const nextStepNum = formInstructions.length + 1;
                setFormInstructions([...formInstructions, emptyStep(nextStepNum)]);
            };

            const handleRemoveStepRow = (index) => {
                const updated = formInstructions.filter((_, i) => i !== index).map((step, idx) => ({
                    ...step,
                    step: idx + 1
                }));
                setFormInstructions(updated.length ? updated : [emptyStep(1)]);
            };

            const handleStepChange = (index, value) => {
                const updated = formInstructions.map((step, i) => {
                    if (i === index) return { ...step, text: value };
                    return step;
                });
                setFormInstructions(updated);
            };

            const handleAddTipRow = () => {
                setFormTips([...formTips, ""]);
            };

            const handleRemoveTipRow = (index) => {
                const updated = formTips.filter((_, i) => i !== index);
                setFormTips(updated.length ? updated : [""]);
            };

            const handleTipChange = (index, value) => {
                const updated = formTips.map((tip, i) => {
                    if (i === index) return value;
                    return tip;
                });
                setFormTips(updated);
            };

            const buildRecipePrompt = (text) => {
                return `你是一個專業的烘焙大師與 JSON 結構化轉換器。請將以下食譜文字轉換為繁體中文，並將所有的英制或體積單位轉換為烘焙專用的公制單位（例如：克、毫升、顆、個、適量）。

請嚴格遵守以下轉換邏輯（烘焙密度換算）：
1. 麵粉 (Flour): 1 cup = 120g
2. 細砂糖 (Granulated Sugar): 1 cup = 200g
3. 黑糖 (Brown Sugar): 1 cup = 200g
4. 糖粉 (Powdered Sugar): 1 cup = 120g
5. 奶油 (Butter): 1 cup = 227g, 1 stick = 113g, 1 tbsp = 14g, 1 tsp = 5g
6. 水/牛奶/鮮奶油 (Water/Milk/Cream): 1 cup = 240ml, 1 tbsp = 15ml, 1 tsp = 5ml
7. 泡打粉/小蘇打/鹽 (Baking Powder/Soda/Salt): 1 tsp = 5g, 1/2 tsp = 2.5g, 1/4 tsp = 1.5g
8. 溫度轉換：將華氏溫度 (°F) 轉換為攝氏溫度 (°C)（例如：350°F ➔ 175°C, 325°F ➔ 163°C）。
9. 步驟大括號佔位符：在製作步驟 (instructions) 的文字中，只要提到成分名稱，必須使用大括號格式，例如「將軟化的 {無鹽奶油 (軟化)} 和 {細砂糖} 徹底打發」。大括號內的名稱必須與 ingredients 列表中的 name 完全一致。
10. 若有些食材是裝飾或裝飾用（非計量），請設置 isStatic: true，且 unit 設為 "適量"。

請嚴格僅輸出純 JSON 物件（不要包含 Markdown codeblock 標記，不要有任何前導或後續說明）：
{
  "name": "中文食譜名稱",
  "englishName": "英文名稱",
  "description": "簡短描述",
  "basePan": { "shape": "round", "size": 9, "unit": "inch" },
  "tips": ["小貼士1"],
  "ingredients": [
    { "category": "dry", "name": "麵粉", "baseValue": 120, "unit": "克", "note": "", "isStatic": false }
  ],
  "instructions": [
    { "step": 1, "text": "預熱烤箱..." }
  ]
}

要轉換的原始食譜如下：
${text}`;
            };

            const applyParsedRecipeToForm = (parsed) => {
                setFormName(parsed.name || "");
                setFormEngName(parsed.englishName || "");
                setFormDesc(parsed.description || "");
                
                if (parsed.basePan) {
                    setFormPanShape(parsed.basePan.shape || "round");
                    if (parsed.basePan.shape === "loaf") {
                        setFormPanLength(parsed.basePan.length || 9);
                        setFormPanWidth(parsed.basePan.width || 5);
                    } else {
                        setFormBaseSize(parsed.basePan.size || 9);
                    }
                }

                if (parsed.tips && parsed.tips.length > 0) {
                    setFormTips(parsed.tips);
                } else {
                    setFormTips([""]);
                }

                if (parsed.ingredients && parsed.ingredients.length > 0) {
                    setFormIngredients(parsed.ingredients.map(ing => ({
                        category: ing.category || "dry",
                        name: ing.name || "",
                        baseValue: ing.baseValue || 0,
                        unit: ing.unit || "克",
                        note: ing.note || "",
                        isStatic: ing.isStatic || false
                    })));
                } else {
                    setFormIngredients([emptyIngredient()]);
                }

                if (parsed.instructions && parsed.instructions.length > 0) {
                    setFormInstructions(parsed.instructions.map((step, idx) => ({
                        step: idx + 1,
                        text: step.text || ""
                    })));
                } else {
                    setFormInstructions([emptyStep(1)]);
                }

                setImportMode("manual");
                setRawRecipeText("");
                setManualJsonText("");
            };

            const handleCopyPrompt = async () => {
                if (!rawRecipeText.trim()) {
                    setFormError("請先在上面貼上要轉換的食譜文字！");
                    return;
                }
                const prompt = buildRecipePrompt(rawRecipeText);
                try {
                    await navigator.clipboard.writeText(prompt);
                    setCopyPromptStatus("✅ 已複製 AI 提示詞！您可以開啟網頁版 Gemini / ChatGPT / Claude 貼上。");
                    setTimeout(() => setCopyPromptStatus(""), 5000);
                } catch(e) {
                    setFormError("複製失敗，請手動複製。");
                }
            };

            const handleApplyManualJson = () => {
                if (!manualJsonText.trim()) {
                    setFormError("請先貼上 AI 回傳的 JSON 文字！");
                    return;
                }
                try {
                    // 清理可能包含的 Markdown codeblock 標籤
                    let cleanJson = manualJsonText.trim();
                    if (cleanJson.startsWith("```json")) cleanJson = cleanJson.replace(/^```json/, "");
                    if (cleanJson.startsWith("```")) cleanJson = cleanJson.replace(/^```/, "");
                    if (cleanJson.endsWith("```")) cleanJson = cleanJson.replace(/```$/, "");
                    
                    const parsed = JSON.parse(cleanJson.trim());
                    applyParsedRecipeToForm(parsed);
                } catch(e) {
                    setFormError("JSON 格式不正確，請確認已完整複製 AI 回傳的內容: " + e.message);
                }
            };

            const handleAIImport = async () => {
                if (!rawRecipeText.trim()) {
                    setFormError("請貼上要轉換的食譜文字！");
                    return;
                }

                setIsImporting(true);
                setFormError("");

                try {
                    const prompt = buildRecipePrompt(rawRecipeText);
                    let textResult = "";

                    if (apiProvider === "groq") {
                        if (!groqKey.trim()) throw new Error("請填寫 Groq API Key！（可至 console.groq.com 免費申請，秒過免綁卡）");
                        localStorage.setItem("magic_baking_groq_api_key", groqKey.trim());
                        
                        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${groqKey.trim()}`
                            },
                            body: JSON.stringify({
                                model: "llama-3.3-70b-versatile",
                                messages: [{ role: "user", content: prompt }],
                                response_format: { type: "json_object" }
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `Groq API 錯誤 (${response.status})`);
                        }
                        const resJson = await response.json();
                        textResult = resJson.choices?.[0]?.message?.content;
                    } 
                    else if (apiProvider === "openrouter") {
                        if (!openrouterKey.trim()) throw new Error("請填寫 OpenRouter API Key！（可至 openrouter.ai 申請）");
                        localStorage.setItem("magic_baking_openrouter_api_key", openrouterKey.trim());

                        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${openrouterKey.trim()}`
                            },
                            body: JSON.stringify({
                                model: "google/gemini-2.0-flash-exp:free",
                                messages: [{ role: "user", content: prompt }],
                                response_format: { type: "json_object" }
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `OpenRouter API 錯誤 (${response.status})`);
                        }
                        const resJson = await response.json();
                        textResult = resJson.choices?.[0]?.message?.content;
                    } 
                    else {
                        // Google Gemini API
                        if (!apiKey.trim()) throw new Error("請填寫 Gemini API 金鑰！");
                        localStorage.setItem("magic_baking_gemini_api_key", apiKey.trim());
                        localStorage.setItem("magic_baking_gemini_model", apiModel);

                        const targetModel = apiModel || "gemini-2.0-flash";
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey.trim()}`;
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            if (response.status === 429) {
                                throw new Error("⚠️ Gemini API 免費額度限制。建議切換上方服務提供者為「Groq API (100% 免費高額度)」或使用「免 Key 手動模式」。");
                            }
                            throw new Error(errData.error?.message || `HTTP 錯誤 ${response.status}`);
                        }

                        const resJson = await response.json();
                        textResult = resJson.candidates?.[0]?.content?.parts?.[0]?.text;
                    }

                    if (!textResult) throw new Error("AI 沒有傳回有效內容");

                    // 清理 codeblock 標記並解析
                    let cleanText = textResult.trim();
                    if (cleanText.startsWith("```json")) cleanText = cleanText.replace(/^```json/, "");
                    if (cleanText.startsWith("```")) cleanText = cleanText.replace(/^```/, "");
                    if (cleanText.endsWith("```")) cleanText = cleanText.replace(/```$/, "");

                    const parsed = JSON.parse(cleanText.trim());
                    applyParsedRecipeToForm(parsed);
                } catch (e) {
                    console.error("AI 轉換錯誤:", e);
                    setFormError("轉換失敗: " + e.message);
                } finally {
                    setIsImporting(false);
                }
            };

            const handleOpenEditModal = (recipeToEdit, e) => {
                if (e) e.stopPropagation();
                const target = recipeToEdit || activeRecipe;
                if (!target) return;

                setEditingRecipeId(target.id);
                setFormName(target.name || "");
                setFormEngName(target.englishName || "");
                setFormDesc(target.description || "");
                
                const shape = target.basePan?.shape || "round";
                setFormPanShape(shape);
                if (shape === "round" || shape === "square") {
                    setFormBaseSize(target.basePan?.size || 8);
                } else if (shape === "loaf") {
                    setFormPanLength(target.basePan?.length || 9);
                    setFormPanWidth(target.basePan?.width || 5);
                }

                setFormIngredients(
                    target.ingredients && target.ingredients.length
                        ? target.ingredients.map(ing => ({
                            category: ing.category || "dry",
                            name: ing.name || "",
                            baseValue: ing.baseValue !== undefined ? ing.baseValue : "",
                            unit: ing.unit || "克",
                            note: ing.note || "",
                            isStatic: ing.isStatic || false
                        }))
                        : [emptyIngredient()]
                );

                setFormInstructions(
                    target.instructions && target.instructions.length
                        ? target.instructions.map(st => ({ step: st.step, text: st.text || "" }))
                        : [emptyStep(1)]
                );

                setFormTips(target.tips && target.tips.length ? target.tips : [""]);
                setImportMode("manual");
                setFormError("");
                setIsModalOpen(true);
            };

            const handleSaveRecipe = (e) => {
                e.preventDefault();
                setFormError("");

                if (!formName.trim()) {
                    setFormError("請填寫食譜名稱！");
                    return;
                }

                const filteredIngredients = formIngredients.filter(ing => ing.name.trim() !== "");
                if (filteredIngredients.length === 0) {
                    setFormError("請至少填寫一個有效食材名稱！");
                    return;
                }

                const filteredInstructions = formInstructions.filter(step => step.text.trim() !== "");
                if (filteredInstructions.length === 0) {
                    setFormError("請至少填寫一個步驟內容！");
                    return;
                }

                const targetId = editingRecipeId || ("custom_" + Date.now());
                const newRecipe = {
                    id: targetId,
                    isCustom: true,
                    name: formName,
                    englishName: formEngName || "Custom Recipe",
                    description: formDesc || "自訂烘焙食譜，完美比例調整中。",
                    basePan: formPanShape === "round"
                        ? { shape: "round", size: Number(formBaseSize), unit: "inch" }
                        : formPanShape === "square"
                        ? { shape: "square", size: Number(formBaseSize), unit: "inch" }
                        : { shape: "loaf", length: Number(formPanLength), width: Number(formPanWidth), unit: "inch" },
                    tips: formTips.filter(t => t.trim() !== ""),
                    ingredients: filteredIngredients.map(ing => ({
                        category: ing.category,
                        name: ing.name.trim(),
                        baseValue: Number(ing.baseValue) || 0,
                        unit: ing.unit,
                        note: ing.note.trim() || undefined,
                        isStatic: ing.isStatic || undefined
                    })),
                    instructions: filteredInstructions.map((step, idx) => ({
                        step: idx + 1,
                        text: step.text.trim()
                    }))
                };

                const updated = { ...customRecipes, [targetId]: newRecipe };
                setCustomRecipes(updated);
                localStorage.setItem("magic_baking_custom_recipes", JSON.stringify(updated));
                setActiveRecipeId(targetId);
                setIsModalOpen(false);
                resetForm();
            };

            const handleDeleteRecipe = (id, e) => {
                if (e) e.stopPropagation();
                const targetRecipe = rawAllRecipes[id];
                const recipeName = targetRecipe ? targetRecipe.name : "此食譜";
                if (!window.confirm(`確定要刪除「${recipeName}」食譜嗎？刪除後將移出列表。`)) {
                    return;
                }

                const newDeleted = deletedIds.includes(id) ? deletedIds : [...deletedIds, id];
                setDeletedIds(newDeleted);
                localStorage.setItem("magic_baking_deleted_recipes", JSON.stringify(newDeleted));

                if (customRecipes[id]) {
                    const updatedCustom = { ...customRecipes };
                    delete updatedCustom[id];
                    setCustomRecipes(updatedCustom);
                    localStorage.setItem("magic_baking_custom_recipes", JSON.stringify(updatedCustom));
                }

                const remainingKeys = Object.keys(rawAllRecipes).filter(k => !newDeleted.includes(k));
                if (remainingKeys.length > 0) {
                    setActiveRecipeId(remainingKeys[0]);
                }
            };

            

            const handleResetToServerVersion = () => {
                if (window.confirm("確定要清除瀏覽器舊快取，並強制重刷載入 GitHub 最新發布版本嗎？")) {
                    localStorage.removeItem("magic_baking_custom_recipes");
                    localStorage.removeItem("magic_baking_deleted_recipes");
                    window.location.reload(true);
                }
            };

            const handleExportJsonBackup = () => {
                const jsonStr = JSON.stringify(customRecipes, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "my_recipes_backup.json";
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImportJsonBackup = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const imported = JSON.parse(evt.target.result);
                        if (typeof imported === "object") {
                            const merged = { ...customRecipes, ...imported };
                            setCustomRecipes(merged);
                            localStorage.setItem("magic_baking_custom_recipes", JSON.stringify(merged));
                            alert("🎉 成功匯入食譜備份！");
                        }
                    } catch(err) {
                        alert("匯入失敗，請確認 JSON 檔案格式。");
                    }
                };
                reader.readAsText(file);
            };

            const hasUnsavedChanges = JSON.stringify(customRecipes) !== JSON.stringify(savedRecipes);

            const generateUpdatedHtml = async (updatedCustomRecipes, updatedDeletedIds) => {
                let rawHtml = "";
                try {
                    const response = await fetch(window.location.href);
                    rawHtml = await response.text();
                } catch (e) {
                    console.warn("無法透過 fetch 取得 HTML 原始碼，將使用備用方案重建:", e);
                }

                const jsonStr = JSON.stringify(updatedCustomRecipes, null, 4);
                const deletedJsonStr = JSON.stringify(updatedDeletedIds || [], null, 4);

                const placeholderStart = "// [SAVED_RECIPES_PLACEHOLDER]";
                const placeholderEnd = "// [/SAVED_RECIPES_PLACEHOLDER]";
                const deletedStart = "// [DELETED_IDS_PLACEHOLDER]";
                const deletedEnd = "// [/DELETED_IDS_PLACEHOLDER]";

                let htmlResult = rawHtml;
                if (htmlResult && htmlResult.includes(placeholderStart) && htmlResult.includes(placeholderEnd)) {
                    const startIndex = htmlResult.indexOf(placeholderStart) + placeholderStart.length;
                    const endIndex = htmlResult.indexOf(placeholderEnd);
                    htmlResult = htmlResult.substring(0, startIndex) + "\n        const savedRecipes = " + jsonStr + ";\n        " + htmlResult.substring(endIndex);
                }
                if (htmlResult && htmlResult.includes(deletedStart) && htmlResult.includes(deletedEnd)) {
                    const startIndex = htmlResult.indexOf(deletedStart) + deletedStart.length;
                    const endIndex = htmlResult.indexOf(deletedEnd);
                    htmlResult = htmlResult.substring(0, startIndex) + "\n        const savedDeletedIds = " + deletedJsonStr + ";\n        " + htmlResult.substring(endIndex);
                }
                return htmlResult;
            };

            const handleSaveToFile = async () => {
                const updatedHtml = await generateUpdatedHtml(customRecipes, deletedIds);
                try {
                    if (window.showSaveFilePicker) {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: "code_artifact.html",
                            types: [{
                                description: "HTML Files",
                                accept: { "text/html": [".html"] }
                            }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(updatedHtml);
                        await writable.close();
                        
                        // 儲存成功，清除 LocalStorage 中的暫存與已刪除清單
                        localStorage.removeItem("magic_baking_custom_recipes");
                        localStorage.removeItem("magic_baking_deleted_recipes");
                        alert("🎉 成功儲存至檔案本身！此網頁重新整理後自訂食譜依然存在。");
                        window.location.reload();
                        return;
                    }
                } catch (e) {
                    if (e.name !== "AbortError") {
                        console.error("無法使用 File System Access API 寫入檔案:", e);
                    } else {
                        return; // 使用者取消
                    }
                }

                // 備用下載機制
                const blob = new Blob([updatedHtml], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "code_artifact.html";
                a.click();
                URL.revokeObjectURL(url);
                
                alert("📢 瀏覽器不支援直接寫入檔案，已為您下載最新的 code_artifact.html。\n請將其覆蓋/替換掉您原本的檔案以完成儲存！");
            };

            const resetForm = () => {
                setEditingRecipeId(null);

                setFormPanWidth(5);

                            >

                            </button>
                            <button

                    {/* Main Layout Container */}
                    <div className="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

                                                            <input 
                                                                type="number" 
                                                                step="any"
                                                                placeholder="基準量" 
                                                                value={ing.baseValue}
                                                                onChange={e => handleIngredientChange(idx, 'baseValue', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-xs text-center"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                placeholder="單位 (克/毫升)" 
                                                                value={ing.unit}
                                                                onChange={e => handleIngredientChange(idx, 'unit', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-xs text-center"
                                                            />
                                                            <input 
                                                                type="text" 
                                                                placeholder="備註" 
                                                                value={ing.note || ""}
                                                                onChange={e => handleIngredientChange(idx, 'note', e.target.value)}
                                                                className="col-span-2 bg-white border border-stone-200 rounded-lg p-1.5 text-[10px]"
                                                            />
                                                            <div className="col-span-12 md:col-span-1 flex justify-end">
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleRemoveIngredientRow(idx)}
                                                                    className="text-red-500 hover:text-red-700 font-bold text-sm p-1"
                                                                    title="移除此行"
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Dynamic Steps */}
                                            <div className="border-t border-stone-100 pt-6">
                                                <div className="flex justify-between items-center mb-2">
                                                    <h4 className="text-sm font-bold text-stone-800">👩‍🍳 製作步驟</h4>
                                                    <button 
                                                        type="button"
                                                        onClick={handleAddStepRow}
                                                        className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                                    >
                                                        ➕ 新增步驟
                                                    </button>
                                                </div>
                                                <p className="text-[10px] text-stone-500 mb-3 bg-amber-50 p-2 rounded-lg border border-amber-100">
                                                    💡 <strong>魔法提示：</strong>在步驟文字中填入大括號材料 <code>&#123;材料名稱&#125;</code> (如：<code>將乾粉類 &#123;中筋麵粉&#125; 混勻</code>)，網頁會自動依照當前縮放倍率顯示克數！
                                                </p>
                                                <div className="space-y-2">
                                                    {formInstructions.map((step, idx) => (
                                                        <div key={idx} className="flex gap-2 items-start bg-stone-50 p-2 rounded-xl border border-stone-100">
                                                            <span className="text-xs font-black text-amber-600 bg-amber-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-1">
                                                                {step.step}
                                                            </span>
                                                            <textarea 
                                                                placeholder={`步驟 ${step.step} 敘述...`} 
                                                                value={step.text}
                                                                onChange={e => handleStepChange(idx, e.target.value)}
                                                                rows="2"
                                                                className="flex-1 bg-white border border-stone-200 rounded-lg p-2 text-xs focus:outline-none focus:ring-1 focus:ring-amber-500"
                                                            ></textarea>
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleRemoveStepRow(idx)}
                                                                className="text-red-500 hover:text-red-700 font-bold text-sm p-1 mt-1"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Cooking Tips */}
                                            <div className="border-t border-stone-100 pt-6">
                                                <div className="flex justify-between items-center mb-3">
                                                    <h4 className="text-sm font-bold text-stone-800">✨ 烘焙小貼士 / 溫馨提示</h4>
                                                    <button 
                                                        type="button"
                                                        onClick={handleAddTipRow}
                                                        className="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                                    >
                                                        ➕ 新增貼士
                                                    </button>
                                                </div>
                                                <div className="space-y-2">
                                                    {formTips.map((tip, idx) => (
                                                        <div key={idx} className="flex gap-2 items-center bg-stone-50 p-2 rounded-xl border border-stone-100">
                                                            <input 
                                                                type="text" 
                                                                placeholder="例如：奶油切丁軟化得比較快" 
                                                                value={tip}
                                                                onChange={e => handleTipChange(idx, e.target.value)}
                                                                className="flex-1 bg-white border border-stone-200 rounded-lg p-1.5 text-xs focus:outline-none"
                                                            />
                                                            <button 
                                                                type="button"
                                                                onClick={() => handleRemoveTipRow(idx)}
                                                                className="text-red-500 hover:text-red-700 font-bold text-sm p-1"
                                                            >
                                                                ✕
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="p-6 border-t border-stone-100 bg-stone-50 flex justify-end gap-3 rounded-b-3xl">
                                    <button 
                                        type="button"
                                        onClick={() => { setIsModalOpen(false); resetForm(); }}
                                        className="bg-stone-200 hover:bg-stone-300 text-stone-700 text-sm font-bold py-2 px-4 rounded-xl transition"
                                    >
                                        取消
                                    </button>
                                    {importMode === "manual" && (
                                        <button 
                                            type="button"
                                            onClick={handleSaveRecipe}
                                            className="bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold py-2 px-6 rounded-xl transition shadow-xs"
                                        >
                                            {editingRecipeId ? "更新並儲存食譜" : "儲存食譜"}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    
    
    </script>
</body>
</html>
